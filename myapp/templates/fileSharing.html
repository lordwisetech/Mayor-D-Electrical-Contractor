<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account Settings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --primary: #FFD700;
      --dark: #00ffcc;
      --light-bg: rgba(255, 255, 255, 0.05);
      --accent: #FFB300;
    }

    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: var(--dark);
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 2rem;
      padding: 2rem;
      background: rgba(0, 255, 204, 0.07);
      border-bottom: 1px solid var(--primary);
      box-shadow: 0 5px 15px rgba(0, 255, 204, 0.2);
      border-radius: 0 0 1rem 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .profile-pic {
      /* display: flex; */
      /* flex-direction: ; */
      align-items: center;
      padding-left: 45%;
    }

    .profile-pic img {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid var(--primary);
      box-shadow: 0 0 12px var(--primary);
      transition: transform 0.3s ease;
      margin-bottom: 0.5rem;
    }

    .profile-pic img:hover {
      transform: scale(1.05);
    }

    .bio-preview {
      flex: 1;
    }

    .bio-preview .preview-box {
      margin-top: 0.5rem;
    }

    form {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--primary);
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      animation: fadeIn 1s ease-in;
    }

    h2 {
      text-align: center;
      color: var(--primary);
      font-weight: bold;
    }

    label {
      display: block;
      margin-top: 1.5rem;
      color: var(--dark);
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.3rem;
      border-radius: 0.5rem;
      border: 1px solid var(--dark);
      background: #fffdf3;
    }

    .preview-box {
      background-color: rgba(255, 255, 255, 0.07);
      padding: 0.8rem;
      border-radius: 0.5rem;
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.2);
      margin-bottom: 0.5rem;
      color: #eee;
    }

    .toggle-btn {
      background: none;
      color: var(--primary);
      border: none;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .toggle-field { display: none; }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-top: 1.5rem;
    }

    .btn-save {
      margin-top: 2rem;
      width: 100%;
      background: var(--primary);
      color: #000;
      padding: 0.75rem;
      font-size: 1rem;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s ease, transform 0.2s;
    }

    .btn-save:hover {
      background: var(--accent);
      transform: scale(1.03);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    
    

    @media (max-width: 600px) {
  .profile-header {
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .profile-pic img {
    width: 100px;
    height: 100px;
  }

  .bio-preview {
    width: 100%;
  }

  input[type="file"] {
    width: 100%;
    margin-top: 0.5rem;
  }
}

  </style>
</head>
<body>


<form method="POST" enctype="multipart/form-data">
  {% csrf_token %}



  <label>Code</label>
  <div class="preview-box">{{ profile.sharecode }}</div>
  <button type="button" class="toggle-btn" data-target="summary-input">Transfer Code</button>
  <textarea id="summary-input" class="toggle-field" name="ShareCode">{{ profile.sharecode }}</textarea>


  <button type="submit" class="btn-save">⚡ Save Changes</button>
</form>


<br><br><br><br><br><br>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".toggle-btn").forEach(button => {
      button.addEventListener("click", () => {
        const target = document.getElementById(button.dataset.target);
        target.style.display = target.style.display === "block" ? "none" : "block";
      });
    });
  });
</script>

}
</body>
</html>
