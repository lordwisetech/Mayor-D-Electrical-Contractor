{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Engineer Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --primary: #FFD700;
      --glow: 0 0 10px #00ffcc, 0 0 20px #00ffcc33;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(to bottom, #000, #111);
      color: #fff;
    }

    header {
      background: #00ffcc;
      padding: 1rem;
      text-align: center;
      color: #000;
      font-weight: bold;
      font-size: 1.2rem;
      box-shadow: var(--glow);
    }

    .welcome {
      padding: 1.5rem 1rem 0.5rem;
      font-size: 1.1rem;
      text-align: center;
      color: #00ffaa;
    }

    .profile-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 1rem;
      padding: 1rem;
      position: relative;
    }

    .profile-pic img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid var(--primary);
      box-shadow: 0 0 12px var(--primary);
      transition: transform 0.3s ease;
    }

    .profile-pic img:hover {
      transform: scale(1.05);
    }

    .email {
      position: absolute;
      top: 0.5rem;
      right: 1rem;
      font-size: 0.8rem;
      color: #aaa;
      opacity: 0.8;
    }

    .bio-text {
      font-size: 0.85rem;
      margin-top: 0.8rem;
      color: #ccc;
      text-align: center;
      max-width: 300px;
      font-style: italic;
    }

    .info-card {
      background: rgba(255, 255, 255, 0.05);
      margin: 1.5rem auto;
      max-width: 90%;
      padding: 1rem;
      border-radius: 10px;
      color: #eee;
      text-align: center;
      box-shadow: var(--glow);
    }

    .tabs {
      display: flex;
      justify-content: space-around;
      background: #111;
      padding: 0.8rem 0;
      position: fixed;
      bottom: 0;
      width: 100%;
      border-top: 1px solid #00ffcc44;
    }

    .tab {
      color: #00ffcc;
      font-size: 0.9rem;
      text-decoration: none;
      font-weight: 500;
    }

    @media (max-width: 600px) {
      .profile-pic img {
        width: 100px;
        height: 100px;
      }

      .email {
        font-size: 0.75rem;
        top: 0.2rem;
        right: 0.5rem;
      }

      .bio-text {
        font-size: 0.8rem;
        max-width: 90%;
      }
    }
  </style>
</head>
<body>

  <header>⚡ Engineer Dashboard – Mayor D</header>

  <div class="welcome">
    Welcome, Engr. {{ request.user.username }} 👷‍♂️
  </div>

  <div class="profile-box">
    
    <div class="profile-pic">
      {% if profile.avatar %}
        <img src="{{ profile.avatar.url }}" alt="Profile Picture">
      {% else %}
        <img src="{% static 'images/default-profile.png' %}" alt="No Profile">
      {% endif %}
    </div>
    <div class="bio-text">{{ profile.Bio|default:"No bio provided yet." }}</div>
  </div>

  
  {% include 'partials/engineer_tabs.html' %}

</body>
</html>
